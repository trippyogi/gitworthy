name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Docs link check
        run: pnpm docs:links
      - name: Frozen eval (offline)
        run: pnpm eval:frozen
      - name: Frozen perf counters (offline)
        run: pnpm bench:frozen
      - name: Release metadata sync
        env:
          GITWORTHY_RELEASE_ALLOW_DIRTY: '1'
        run: pnpm release:verify

  package-smoke:
    name: Package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:package
      - run: pnpm mcp:self-test
      - name: Upgrade smoke (published → packed → rollback)
        run: pnpm test:upgrade
        continue-on-error: true
